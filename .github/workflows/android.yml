name: Android build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/owner.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/owner.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK uses a throwaway key and Google sign-in will not work."
          fi
      - run: gradle -p android :core:jvmTest assembleDebug testDebugUnitTest --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Check signing fingerprint
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          # Must match the SHA-1 registered for the Android OAuth client in Google Cloud. Fingerprints are public.
          expected="AA:7F:50:02:AD:AF:26:9C:0B:3D:B3:24:A3:2B:6F:69:9F:CE:DF:F8"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 "certificate SHA-1 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "APK signed with SHA-1 $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK fingerprint $actual does not match the registered $expected. Check the four signing secrets."
            exit 1
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/owner.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-storage-report
          path: android/core/build/storage-report.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: samacha-RAM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
